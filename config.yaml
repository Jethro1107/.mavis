logLevel: info
provider:
  minimax:
    name: MiniMax
    npm: '@ai-sdk/anthropic'
    models:
      MiniMax-M2.7:
        name: MiniMax-M2.7
        attachment: false
        reasoning: true
        temperature: true
        tool_call: true
        limit:
          context: 200000
          output: 128000
        modalities:
          input:
            - text
          output:
            - text
      MiniMax-M2.7-highspeed:
        name: MiniMax-M2.7-highspeed
        attachment: false
        reasoning: true
        temperature: true
        tool_call: true
        limit:
          context: 200000
          output: 128000
        modalities:
          input:
            - text
          output:
            - text
      MiniMax-M3:
        name: MiniMax-M3
        attachment: true
        reasoning: true
        temperature: true
        tool_call: true
        limit:
          context: 512000
          output: 128000
        modalities:
          input:
            - text
            - image
            - video
          output:
            - text
        options:
          reasoningSummary: auto
    whitelist:
      - MiniMax-M2.7-highspeed
      - MiniMax-M2.7
      - MiniMax-M3
    options:
      apiKey: sk-xxx
      baseURL: https://agent.minimax.io/mavis/api/v1/llm/v1
defaultModel: minimax/MiniMax-M2.7
nexus:
  enabled: true
  model:
    providerID: minimax
    modelID: MiniMax-M2.7-highspeed
